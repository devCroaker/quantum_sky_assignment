name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install from the lockfile
        # --locked fails if backend/uv.lock and pyproject.toml disagree, so a
        # dependency change cannot reach main without its lockfile. That is
        # also what makes the audit jobs in security.yml meaningful: they
        # report on the versions that actually get installed.
        env:
          # Absolute, because uv resolves a relative UV_PROJECT_ENVIRONMENT
          # against the --project directory and would put the virtualenv in
          # backend/ while every later step looks for it at the repository
          # root. The Makefile passes $(CURDIR) for the same reason.
          UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
        run: uv sync --project backend --extra dev --locked
      - name: Lint
        run: |
          .venv/bin/ruff check backend
          .venv/bin/ruff format --check backend
      - name: Type-check
        working-directory: backend
        run: ../.venv/bin/mypy
      - name: Test
        working-directory: backend
        run: ../.venv/bin/pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip until the front end exists
        id: probe
        run: |
          if [ -f frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "frontend/package.json absent, lands in P15"
          fi
      - uses: actions/setup-node@v7
        if: steps.probe.outputs.present == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, lint, type-check, test
        if: steps.probe.outputs.present == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test -- --run
